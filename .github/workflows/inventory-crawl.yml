name: Inventory crawl

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Total deterministic crawl shards"
        required: true
        default: "4"
      shard:
        description: "Zero-based shard to run"
        required: true
        default: "0"
  schedule:
    - cron: "41 4 * * 1,4"

permissions:
  contents: read

concurrency:
  group: inventory-crawl-${{ github.ref }}-${{ inputs.shard || 'scheduled' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: echo "Crawl requires a populated, permitted registry and adapter configuration."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-checkpoint-${{ github.run_id }}
          path: |
            checkpoints/
            failures/
          if-no-files-found: ignore

name: Inventory crawl

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Total deterministic crawl shards"
        required: true
        default: "4"
      shard:
        description: "Zero-based shard to run"
        required: true
        default: "0"
  schedule:
    - cron: "23 6 * * 2,5"

permissions:
  contents: read

concurrency:
  group: inventory-crawl-${{ github.ref }}-${{ inputs.shard || 'scheduled' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: ontario-auto-index --database data/registry.sqlite3 registry-import data/dealers.json
      - run: ontario-auto-index --database data/registry.sqlite3 ingest --dealer all --output data/crawled-vehicles.json
      - run: ontario-auto-index validate data/crawled-vehicles.json --output data/validated-vehicles.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-checkpoint-${{ github.run_id }}
          path: |
            checkpoints/
            failures/
            data/crawled-vehicles.json
            data/validated-vehicles.json
            data/ingestion-failures.json
          if-no-files-found: ignore

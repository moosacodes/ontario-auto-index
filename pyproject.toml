[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontario-auto-index"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "selectolax>=0.3", "scrapy>=2.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
browser = ["playwright>=1.45"]

[project.scripts]
ontario-auto-index = "ontario_auto_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
